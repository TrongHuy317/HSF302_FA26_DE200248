<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết sinh viên')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    
    <h2>Chi tiết sinh viên</h2>
    
    <p><strong>ID:</strong> <span th:text="${student.id}"></span></p>
    <p><strong>Tên:</strong> <span th:text="${student.name}"></span></p>
    <p><strong>Email:</strong> <span th:text="${student.email}"></span></p>
    <p><strong>Tuổi:</strong> <span th:text="${student.age}"></span></p>
    <p><strong>Chuyên ngành:</strong> <span th:text="${student.major}"></span></p>
    <p><strong>GPA:</strong> <span th:text="${student.gpa}"></span></p>
    
    <br/>
    <a th:href="@{/students}">Quay lại danh sách</a> | 
    <a th:href="@{/students/edit/{id}(id=${student.id})}">Sửa</a>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
