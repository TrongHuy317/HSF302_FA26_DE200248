<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Danh sách sinh viên</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people-fill me-2"></i>Danh sách sinh viên</h2>
        <a th:href="@{/students/create}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm sinh viên
        </a>
    </div>

    <!-- BẮT ĐẦU FORM TÌM KIẾM -->
    <div class="row mb-3">
        <div class="col-md-6">
            <form method="get" th:action="@{/students}">
                <div class="input-group shadow-sm">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Nhập tên hoặc email để tìm kiếm...">
                    <button type="submit" class="btn btn-secondary">
                        <i class="bi bi-search me-1"></i> Tìm
                    </button>
                    <!-- Nút Xóa lọc chỉ hiện ra khi người dùng ĐANG tìm kiếm (keyword không rỗng) -->
                    <a th:if="${keyword != null and !keyword.isEmpty()}" th:href="@{/students}" class="btn btn-outline-danger">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>
    <!-- KẾT THÚC FORM TÌM KIẾM -->

    <div class="card shadow-sm">
        <div class="card-body p-0">

            <!-- Trường hợp rỗng -->
            <div th:if="${#lists.isEmpty(students)}" class="text-center p-5 text-muted">
                <i class="bi bi-inbox display-4"></i>
                <p class="mt-2">Chưa có sinh viên nào.</p>
                <a th:href="@{/students/create}" class="btn btn-outline-primary">Thêm ngay</a>
            </div>

            <!-- Bảng dữ liệu -->
            <table th:unless="${#lists.isEmpty(students)}" class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    
                    <!-- CỘT ID -->
                    <th>
                        <a class="text-dark text-decoration-none"
                           th:href="@{/students(keyword=${keyword}, page=0, size=5, sortField='id', sortDir=${sortField == 'id' ? reverseSortDir : 'asc'})}">
                            ID
                            <i th:if="${sortField == 'id'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up-short' : 'bi bi-arrow-down-short'}"></i>
                        </a>
                    </th>
                    
                    <!-- CỘT HỌ TÊN -->
                    <th>
                        <a class="text-dark text-decoration-none"
                           th:href="@{/students(keyword=${keyword}, page=0, size=5, sortField='name', sortDir=${sortField == 'name' ? reverseSortDir : 'asc'})}">
                            Họ tên
                            <i th:if="${sortField == 'name'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up-short' : 'bi bi-arrow-down-short'}"></i>
                        </a>
                    </th>
                    
                    <!-- CỘT EMAIL -->
                    <th>
                        <a class="text-dark text-decoration-none"
                           th:href="@{/students(keyword=${keyword}, page=0, size=5, sortField='email', sortDir=${sortField == 'email' ? reverseSortDir : 'asc'})}">
                            Email
                            <i th:if="${sortField == 'email'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up-short' : 'bi bi-arrow-down-short'}"></i>
                        </a>
                    </th>
                    
                    <!-- CỘT TUỔI -->
                    <th>
                        <a class="text-dark text-decoration-none"
                           th:href="@{/students(keyword=${keyword}, page=0, size=5, sortField='age', sortDir=${sortField == 'age' ? reverseSortDir : 'asc'})}">
                            Tuổi
                            <i th:if="${sortField == 'age'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up-short' : 'bi bi-arrow-down-short'}"></i>
                        </a>
                    </th>
                    
                    <!-- CỘT CHUYÊN NGÀNH -->
                    <th>
                        <a class="text-dark text-decoration-none"
                           th:href="@{/students(keyword=${keyword}, page=0, size=5, sortField='major', sortDir=${sortField == 'major' ? reverseSortDir : 'asc'})}">
                            Chuyên ngành
                            <i th:if="${sortField == 'major'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up-short' : 'bi bi-arrow-down-short'}"></i>
                        </a>
                    </th>
                    
                    <!-- CỘT GPA -->
                    <th>
                        <a class="text-dark text-decoration-none"
                           th:href="@{/students(keyword=${keyword}, page=0, size=5, sortField='gpa', sortDir=${sortField == 'gpa' ? reverseSortDir : 'asc'})}">
                            GPA
                            <i th:if="${sortField == 'gpa'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up-short' : 'bi bi-arrow-down-short'}"></i>
                        </a>
                    </th>
                    
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student, stat : ${students}">
                    <td th:text="${stat.count}">1</td>
                    <td th:text="${student.id}">1</td>
                    <td>
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           th:text="${student.name}"
                           class="text-decoration-none fw-semibold">Tên</a>
                    </td>
                    <td th:text="${student.email}">email</td>
                    <td th:text="${student.age}">20</td>
                    <td><span class="badge bg-secondary" th:text="${student.major}">CNTT</span></td>
                    <td>
                        <span th:classappend="${student.gpa >= 3.5} ? 'gpa-high' :
                                              (${student.gpa >= 2.5} ? 'gpa-mid' : 'gpa-low')"
                              th:text="${#numbers.formatDecimal(student.gpa, 1, 1)}">3.5</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           class="btn btn-sm btn-outline-info me-1" title="Chi tiết">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/students/{id}/edit(id=${student.id})}"
                           class="btn btn-sm btn-outline-warning me-1" title="Sửa">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/students/{id}/delete(id=${student.id})}"
                              method="post" class="d-inline"
                              th:data-name="${student.name}"
                              onsubmit="return confirm('Xóa sinh viên ' + this.dataset.name + '?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Khu vực hiển thị Tổng số và Phân trang (Chỉ hiện khi có dữ liệu) -->
    <div th:if="${totalPages > 0}" class="d-flex justify-content-between align-items-center mt-3">
        <!-- Tổng số bản ghi -->
        <div class="text-muted">
            <small>Tổng: <strong th:text="${totalItems}">0</strong> sinh viên</small>
        </div>

        <!-- Thanh phân trang Bootstrap -->
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm mb-0">
                
                <!-- Nút "Trước" -->
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/students(keyword=${keyword}, page=${currentPage - 1}, size=5, sortField=${sortField}, sortDir=${sortDir})}">
                        &laquo; Trước
                    </a>
                </li>

                <!-- Hiển thị các con số 1, 2, 3... -->
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                    th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/students(keyword=${keyword}, page=${i}, size=5, sortField=${sortField}, sortDir=${sortDir})}" th:text="${i + 1}">1</a>
                </li>

                <!-- Nút "Sau" -->
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/students(keyword=${keyword}, page=${currentPage + 1}, size=5, sortField=${sortField}, sortDir=${sortDir})}">
                        Sau &raquo;
                    </a>
                </li>
                
            </ul>
        </nav>
    </div>

</section>
</body>
</html>
